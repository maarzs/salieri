appId: com.salieri.ai
productName: Salieri AI
directories:
  output: release
  buildResources: assets

# Files that make up the Electron app itself (the shell only).
files:
  - dist/main/**
  - dist/renderer/**
  - assets/**
  - package.json

# Extra files copied into the app's resources folder (process.resourcesPath).
# The backend is a SIDECAR: an embedded Python distribution + live source
# files kept as LOOSE FILES under resources/backend/ — never packed into the
# exe or the asar. This keeps the backend independently updatable: replace
# the folder (or pip-install extra modules into its site-packages) without
# rebuilding or reinstalling the app.
extraResources:
  # Embedded Python runtime + CORE pip dependencies + backend source.
  # Produced by: python backend/scripts/setup_embedded_python.py
  # Heavy optional modules (faster-whisper, torch, sentence-transformers)
  # are NOT included — they're installed on demand from the app's
  # Settings → Modules panel.
  - from: backend/dist
    to: backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/.git/**"
  # NOTE: backend/.env is intentionally NOT bundled here. It may contain a
  # live API key and would be shipped to every user of the installer. Keys
  # belong in the in-app Settings panel (persisted to %APPDATA%\Salieri).

win:
  target:
    - nsis
    # Portable single-exe: self-extracts app + sidecar to a temp dir and
    # runs it. Because the backend is a sidecar folder (not baked in), this
    # works with the embedded-Python layout unchanged.
    - portable

nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Salieri AI

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

# Don't compress the backend's Python runtime inside asar; keep startup sane.
# (The backend isn't in the asar at all — it ships via extraResources above.)
asar: true
